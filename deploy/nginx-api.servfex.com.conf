# Socket.IO + REST for api.servfex.com
# Install into the live nginx site, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Do not add Access-Control-* here — Node sets credential-safe CORS (echoed Origin,
# never `*`). nginx add_header would duplicate/override and Chrome would block.
#
# Never set Connection "upgrade" on all /api/ traffic. That breaks Engine.IO polling
# and produces "WebSocket is closed" plus polling 400 Session ID unknown.

# http {
#   map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
#   }
#   client_max_body_size 700m;
# }

